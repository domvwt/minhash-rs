name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy datasketch joblib

      - name: Build wheel (debug for speed)
        run: maturin build --out dist

      - name: Install wheel
        run: pip install --no-index --find-links dist minhash-rs

      - name: Run correctness harness
        run: python tests/correctness.py
