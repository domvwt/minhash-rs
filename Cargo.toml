[package]
name = "minhash_rs"
version = "0.1.0"
edition = "2021"
authors = ["Dominic Thorn <dominic.thorn@gmail.com>"]
description = "Rust port of datasketch.MinHash's core algorithm: batch MinHash signatures with optional rayon parallelism."
license = "MIT"
repository = "https://github.com/domvwt/minhash-rs"

# maturin's `module-name = "minhash_rs._native"` in pyproject.toml renames
# the produced cdylib to `_native.abi3.so` regardless of the lib name here,
# but we match it explicitly to avoid confusing anyone reading Cargo output.
[lib]
name = "_native"
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
# PyO3 0.22 lines up with the numpy crate's 0.22 release (numpy >= 1.26 at the
# Python side, including the 2.x ABI).
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
numpy = "0.22"
sha1 = "0.10"
rayon = "1"
